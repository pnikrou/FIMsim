name: Build FIMsim Installers

# Push a tag like v1.2.0   -> build both installers, check them, publish a Release.
# Push a branch ci/<name>  -> build and check them, publish nothing (a dry run).
# Or run it by hand from the Actions tab (also a dry run).
#
# What the installers contain and why: see installer/README.md.
# Every installer is CHECKED before it can be published: it is installed the way
# a user installs it, started for the first time on an empty machine (which
# builds the whole Python environment from environment.yml and
# requirements-pip.txt), and then the self-check installer/smoke_test.py has to
# pass - dependency check, git / aws / flood-mapping run, main window opens.
# The checks use the app's REAL default locations (no FIMSIM_HOME), so a problem
# that only shows in the place users actually get - such as a space in the
# path - is caught here (1.2.0 shipped with exactly that bug).
on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - "ci/**"
  workflow_dispatch:

env:
  MICROMAMBA_VERSION: "2.9.0-0"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # macOS .dmg - one app for Apple Silicon and Intel.  Built, installed and
  # started for the first time on BOTH kinds of Mac; each job publishes the
  # same .dmg.  Two jobs instead of one so a release is not stuck when GitHub
  # cannot hand out one kind of macOS machine: some organisations (sdmlua among
  # them) sometimes wait 15 min for a Mac and then get "The job was not acquired
  # by Runner".  The release step below goes ahead when at least one Mac job
  # passed and none FAILED.  If a Mac job only never started, use
  # "Re-run failed jobs" on the run page.
  # ────────────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match the VERSION file ($v)"; exit 1; }

      - name: Get micromamba (Apple Silicon and Intel)
        run: |
          base="https://github.com/mamba-org/micromamba-releases/releases/download/$MICROMAMBA_VERSION"
          mkdir -p mm/arm64 mm/x86_64
          curl -fsSL -o mm/arm64/micromamba  "$base/micromamba-osx-arm64"
          curl -fsSL -o mm/x86_64/micromamba "$base/micromamba-osx-64"
          chmod +x mm/arm64/micromamba mm/x86_64/micromamba
          echo "this runner: $(uname -m), macOS $(sw_vers -productVersion)"

      - name: Build FIMsim.app and the .dmg
        run: bash installer/macos/build_app.sh dist mm/arm64/micromamba mm/x86_64/micromamba --dmg

      - name: Install from the .dmg like a user would
        run: |
          hdiutil attach dist/FIMsim-mac.dmg -mountpoint "$RUNNER_TEMP/dmg" -nobrowse -quiet
          mkdir -p "$RUNNER_TEMP/Applications"
          cp -R "$RUNNER_TEMP/dmg/FIMsim.app" "$RUNNER_TEMP/Applications/"
          hdiutil detach "$RUNNER_TEMP/dmg" -quiet
          test -x "$RUNNER_TEMP/Applications/FIMsim.app/Contents/MacOS/FIMsim"

      - name: First launch on an empty Apple Silicon Mac, then the self-check
        run: |
          "$RUNNER_TEMP/Applications/FIMsim.app/Contents/MacOS/FIMsim" --smoke-test

      - name: Start FIMsim the way a double-click does (no screen; must keep running)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "$RUNNER_TEMP/Applications/FIMsim.app/Contents/MacOS/FIMsim" > "$RUNNER_TEMP/gui.log" 2>&1 &
          pid=$!
          sleep 40
          tail -n 40 "$RUNNER_TEMP/gui.log"
          kill -0 "$pid" || { echo "::error::FIMsim exited within 40 s of starting"; exit 1; }
          if grep -q Traceback "$RUNNER_TEMP/gui.log"; then echo "::error::FIMsim printed a traceback"; exit 1; fi
          kill "$pid"

      - name: Report the set-up log if something failed
        if: failure()
        run: |
          log="$HOME/Library/FIMsim/setup.log"
          [ -f "$log" ] || exit 0
          text="$(tail -n 30 "$log" | cut -c1-200 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
          echo "::error title=FIMsim set-up log (last lines)::${text:0:3500}"

      - uses: actions/upload-artifact@v4
        with:
          name: FIMsim-mac-dmg-apple-silicon
          path: dist/FIMsim-mac.dmg
          retention-days: 30

  build-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match the VERSION file ($v)"; exit 1; }

      - name: Get micromamba (Apple Silicon and Intel)
        run: |
          base="https://github.com/mamba-org/micromamba-releases/releases/download/$MICROMAMBA_VERSION"
          mkdir -p mm/arm64 mm/x86_64
          curl -fsSL -o mm/arm64/micromamba  "$base/micromamba-osx-arm64"
          curl -fsSL -o mm/x86_64/micromamba "$base/micromamba-osx-64"
          chmod +x mm/arm64/micromamba mm/x86_64/micromamba
          echo "this runner: $(uname -m), macOS $(sw_vers -productVersion)"

      - name: Build FIMsim.app and the .dmg
        run: bash installer/macos/build_app.sh dist mm/arm64/micromamba mm/x86_64/micromamba --dmg

      - name: Install from the .dmg like a user would
        run: |
          hdiutil attach dist/FIMsim-mac.dmg -mountpoint "$RUNNER_TEMP/dmg" -nobrowse -quiet
          mkdir -p "$RUNNER_TEMP/Applications"
          cp -R "$RUNNER_TEMP/dmg/FIMsim.app" "$RUNNER_TEMP/Applications/"
          hdiutil detach "$RUNNER_TEMP/dmg" -quiet
          test -x "$RUNNER_TEMP/Applications/FIMsim.app/Contents/MacOS/FIMsim"

      - name: First launch on an empty Intel Mac, then the self-check
        run: |
          "$RUNNER_TEMP/Applications/FIMsim.app/Contents/MacOS/FIMsim" --smoke-test

      - name: Start FIMsim the way a double-click does (no screen; must keep running)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "$RUNNER_TEMP/Applications/FIMsim.app/Contents/MacOS/FIMsim" > "$RUNNER_TEMP/gui.log" 2>&1 &
          pid=$!
          sleep 40
          tail -n 40 "$RUNNER_TEMP/gui.log"
          kill -0 "$pid" || { echo "::error::FIMsim exited within 40 s of starting"; exit 1; }
          if grep -q Traceback "$RUNNER_TEMP/gui.log"; then echo "::error::FIMsim printed a traceback"; exit 1; fi
          kill "$pid"

      - name: Report the set-up log if something failed
        if: failure()
        run: |
          log="$HOME/Library/FIMsim/setup.log"
          [ -f "$log" ] || exit 0
          text="$(tail -n 30 "$log" | cut -c1-200 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
          echo "::error title=FIMsim set-up log (last lines)::${text:0:3500}"

      - uses: actions/upload-artifact@v4
        with:
          name: FIMsim-mac-dmg-intel
          path: dist/FIMsim-mac.dmg
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # Windows .exe (Inno Setup)
  # ────────────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match the VERSION file ($v)"; exit 1; }

      - name: Gather the files the installer carries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\payload\bin | Out-Null
          $url = "https://github.com/mamba-org/micromamba-releases/releases/download/$env:MICROMAMBA_VERSION/micromamba-win-64.exe"
          Invoke-WebRequest -Uri $url -OutFile dist\payload\bin\micromamba.exe
          & dist\payload\bin\micromamba.exe --version
          python installer\stage_payload.py dist\payload
          Copy-Item installer\windows\common.ps1, installer\windows\launch.ps1, installer\windows\setup.ps1 dist\payload\
          Copy-Item installer\smoke_test.py dist\payload\

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # From Inno Setup's own GitHub releases (old versions stay there; the
          # files.jrsoftware.org copies are removed when a new version comes out).
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe" -OutFile innosetup.exe
          Start-Process -Wait -FilePath .\innosetup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\InnoSetup6"
          if (-not (Test-Path C:\InnoSetup6\ISCC.exe)) { throw "Inno Setup did not install" }

      - name: Build the installer
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          & C:\InnoSetup6\ISCC.exe "/DAppVersion=$v" installer\windows\FIMsim.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist\FIMsim-setup-windows.exe | Select-Object Name, Length

      - name: Install it like a user would
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "FIMsim-installed"
          Start-Process -Wait -FilePath dist\FIMsim-setup-windows.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dir"
          foreach ($f in "launch.ps1","setup.ps1","common.ps1","smoke_test.py","bin\micromamba.exe","app\main.py","app\environment.yml") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Installed folder is missing $f" }
          }
          "FIMSIM_INSTALL_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: First start on an empty machine, then the self-check
        shell: pwsh
        run: |
          # Windows PowerShell 5.1 is what the Start Menu shortcut uses.
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:FIMSIM_INSTALL_DIR\launch.ps1" -SmokeTest
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Start FIMsim the way the Start Menu shortcut does (no screen; must keep running)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "$env:FIMSIM_INSTALL_DIR\launch.ps1"
          Start-Sleep -Seconds 40
          $err = Join-Path $env:LOCALAPPDATA "FIMsim\fimsim-errors.log"
          if (Test-Path $err) { Get-Content $err -Tail 40 }
          $py = Get-CimInstance Win32_Process -Filter "Name = 'python.exe'" | Where-Object { $_.CommandLine -like '*main.py*' }
          if (-not $py) { throw "FIMsim is not running 40 s after the shortcut started it" }
          if ((Test-Path $err) -and (Select-String -Path $err -Pattern 'Traceback' -Quiet)) { throw "FIMsim printed a traceback" }
          $py | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }

      - name: Report the set-up log if something failed
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA "FIMsim\setup.log"
          if (-not (Test-Path $log)) { exit 0 }
          $text = ((Get-Content $log -Tail 30) | ForEach-Object { $_.Substring(0, [Math]::Min(200, $_.Length)).Replace('%','%25') }) -join '%0A'
          if ($text.Length -gt 3500) { $text = $text.Substring(0, 3500) }
          Write-Host "::error title=FIMsim set-up log (last lines)::$text"

      - uses: actions/upload-artifact@v4
        with:
          name: FIMsim-windows-installer
          path: dist/FIMsim-setup-windows.exe
          retention-days: 30

  # ────────────────────────────────────────────────────────────────────────────
  # Publish the GitHub Release (version tags only)
  # ────────────────────────────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-macos, build-macos-intel]
    runs-on: ubuntu-latest
    # Windows must pass; of the two Mac jobs at least one must pass and neither
    # may FAIL (a Mac job GitHub never started is "cancelled", not failed).
    if: >-
      always() && startsWith(github.ref, 'refs/tags/')
      && needs.build-windows.result == 'success'
      && needs.build-macos.result != 'failure'
      && needs.build-macos-intel.result != 'failure'
      && (needs.build-macos.result == 'success' || needs.build-macos-intel.result == 'success')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: FIMsim-windows-installer
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          pattern: FIMsim-mac-dmg-*
          path: mac/

      - name: Pick the macOS .dmg (both Mac jobs build the same app)
        env:
          ARM: ${{ needs.build-macos.result }}
          INTEL: ${{ needs.build-macos-intel.result }}
        run: |
          if [ -f mac/FIMsim-mac-dmg-apple-silicon/FIMsim-mac.dmg ]; then
            cp mac/FIMsim-mac-dmg-apple-silicon/FIMsim-mac.dmg artifacts/
          else
            cp mac/FIMsim-mac-dmg-intel/FIMsim-mac.dmg artifacts/
          fi
          [ "$ARM" = success ]   || echo "::warning::The Apple Silicon Mac check did not run ($ARM) - this release was checked on an Intel Mac only."
          [ "$INTEL" = success ] || echo "::warning::The Intel Mac check did not run ($INTEL) - this release was checked on an Apple Silicon Mac only."
          ls -la artifacts/

      # GitHub's own CLI (preinstalled on the runner), not a third-party action:
      # an organisation that allows only GitHub-made actions can still release.
      # Re-running for a tag that already has a Release replaces its files.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sed "s/@TAG@/$TAG/g" installer/RELEASE_NOTES.md > notes.md
          files="artifacts/FIMsim-setup-windows.exe artifacts/FIMsim-mac.dmg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
            gh release edit "$TAG" --title "FIMsim $TAG" --notes-file notes.md
          else
            gh release create "$TAG" $files --title "FIMsim $TAG" --notes-file notes.md --verify-tag
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | "\(.name)  \(.size) bytes")'
