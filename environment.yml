# FIMsim environment.  Install in TWO steps - the second is not optional if you
# want the OWP HAND-FIM or ARC-Curve2Flood modes:
#
#     conda env create -f environment.yml
#     conda activate FIMsim
#     python -m core.deps --fix      # HAND-FIM + ARC-Curve2Flood backends
#     python -m core.deps            # must print "Environment OK"
#
# Step 1 (this file) is everything LISFLOOD-FP and TRITON need.  Step 2 installs
# requirements-pip.txt with --no-deps.  It cannot be one resolver run:
# fimserve hard-requires teehr==0.5.0, and TEEHR pins zarr<3 / s3fs<2026 /
# fsspec<2026 while FIMsim runs on zarr 3 / s3fs 2026.  pip cannot satisfy both,
# so a plain `pip install fimserve` backtracks through dozens of old fimserve
# releases (downloading a 450 MB pyspark tarball on the way) and then fails, or
# "succeeds" by downgrading zarr and s3fs and breaking every NWM download.
#
# Do not install packages into this environment one at a time.

name: FIMsim
channels:
  - conda-forge
dependencies:
  - python=3.11
  # Every package below is pinned to the version this release was verified
  # with.  pandas in particular must stay 2.x: pyspark (needed by fimserve/
  # teehr) fails to import under pandas 3 ("cannot import name '_builtin_table'").

  # Geospatial stack via conda-forge - all share the same GDAL, no DLL conflicts
  - rasterio=1.4.4
  - pyproj=3.7.2
  - pyogrio=0.12.1
  - shapely=2.1.2
  - fiona=1.10.1
  - geopandas=1.1.3
  - rioxarray=0.19.0

  # Scientific / numerical
  - numpy=2.0.2
  - scipy=1.17.1
  - pandas=2.3.3
  - pyarrow=24.0.0
  - openpyxl=3.1.5
  - matplotlib-base=3.11.0   # NOT matplotlib - avoids pulling in Qt/PySide6 from conda

  # NetCDF / HDF / cloud storage (NWM retrospective)
  - xarray=2026.4.0
  - zarr=3.1.6        # fimserve's kerchunk dependency requires zarr 3.x
  - numcodecs=0.16.5
  - netcdf4=1.7.4
  - h5netcdf=1.8.1
  - h5py=3.16.0
  - aiofiles=25.1.0

  # Anonymous-S3 stack.  FIMserv reads the NWM retrospective zarr from S3, and
  # `aws s3 sync --no-sign-request` downloads the HUC8 HAND data.  aiobotocore,
  # boto3 and awscli all pin botocore, and when the pins disagree every
  # anonymous S3 read dies with
  #   TypeError: ClientArgsCreator.compute_endpoint_resolver_builtin_defaults()
  #   missing 1 required positional argument: 's3_disable_express_session_auth'
  # and FIMserv then generates FIM with no discharge - i.e. no flood map.
  # These seven are pinned as a set and were verified together; change one and
  # you must change them all.  `python -m core.deps` checks they still agree.
  - fsspec=2026.7.0
  - s3fs=2026.7.0
  - aiobotocore=3.9.0
  - botocore=1.43.36
  - boto3=1.43.36
  - awscli=1.45.36
  - s3transfer=0.19.0

  # Hydrology data download (NHD flowlines, LULC, NWM)
  - pynhd=0.20.0
  - pygeoogc=0.19.4
  - pygeoutils=0.19.5
  - async-retriever=0.19.3

  # ARC-Curve2Flood backend.  gdal gives the osgeo Python bindings these tools
  # import; conda-forge keeps it matched to the same GDAL as rasterio.
  - gdal=3.12.3
  - numba=0.60.0      # pinned: fimserve requires exactly this
  - fastparquet=2026.5.0
  - geojson=3.3.0
  - cython=3.2.9
  - whitebox=2.3.6

  # HTTP / networking
  - requests=2.34.2
  - certifi=2026.6.17
  - urllib3=2.7.0
  - aiohttp=3.14.1

  - pip
  - pip:
      # pip-only.  conda's Qt6 would conflict with this build.
      - pyqt6==6.7.1
      - pyqt6-qt6==6.7.3
      - pyqt6-sip==13.11.1
